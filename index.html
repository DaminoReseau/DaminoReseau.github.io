<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Page de Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 40px;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    p {
      color: #555;
    }
    button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 20px;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>Bienvenue sur ma page de test</h1>
  <p>Ceci est une page HTML très simple.</p>
  <button onclick="alert('Bonjour 👋')">Clique-moi</button>
</body>
</html>
